services:
  addon-marvel:
    image: ghcr.io/cyb3rgh05t/addon-marvel
    container_name: addon-marvel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 7777
      PUBLIC_URL: ${PUBLIC_URL}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.addon-marvel.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.addon-marvel.entrypoints=https
      - traefik.http.routers.addon-marvel.tls=true
      - traefik.http.routers.addon-marvel.tls.certresolver=dns-cloudflare
      - traefik.http.services.addon-marvel.loadbalancer.server.port=7777

networks:
  internal:
    internal: true
  proxy:
    external: true
